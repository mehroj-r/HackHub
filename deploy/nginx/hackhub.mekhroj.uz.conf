# hackhub.mekhroj.uz: HackHub (github.com/ollayorbek0833/HackHub).
#
# Installed as /etc/nginx/sites-available/hackhub.mekhroj.uz and symlinked into
# sites-enabled. Not applied by deploys: after changing it, copy it over, then
# `nginx -t && systemctl reload nginx`.
#
# The checkout is /root/hackhub. docker-compose.prod.yml publishes the app on
# 127.0.0.1:${APP_PORT} (3120 on this server).
#
# TLS: Cloudflare origin certificate for *.mekhroj.uz (proxied through Cloudflare;
# real client IPs come from /etc/nginx/conf.d/cloudflare-realip.conf).
# Auth.js needs X-Forwarded-Proto/Host and AUTH_TRUST_HOST=true behind this proxy.

upstream hackhub_app {
    server 127.0.0.1:3120;
}

server {
    listen 80;
    listen [::]:80;
    server_name hackhub.mekhroj.uz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hackhub.mekhroj.uz;

    ssl_certificate     /etc/nginx/ssl/mekhroj-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/mekhroj-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 1m;

    limit_req zone=global burst=50 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://hackhub_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
